<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>生徒用画面｜音と画像のデジタル化</title>
  <style>
    :root {
      --text-primary:#eef7f5;
      --text-secondary:#bfd3ce;
      --text-on-brand:#052a26;
      --bg:#0e1614;
      --surface:#16211f;
      --subtle:#1d2b28;
      --brand:#3ddbc4;
      --border:#2a3b38;
      --r8:8px;
      --r12:12px;
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text-primary);
    }
    body {
      font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",system-ui,-apple-system,sans-serif;
    }
    .wrap {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:12px;
    }
    .head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }
    .title {
      font-size:22px;
      font-weight:800;
    }
    .sub {
      font-size:12px;
      color:var(--text-secondary);
      margin-top:2px;
    }
    .tabs {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .tabs button,
    .smallbtn {
      min-height:42px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text-secondary);
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }
    .tabs button.active {
      background:var(--brand);
      color:var(--text-on-brand);
      border-color:var(--brand);
    }
    .smallbtn {
      border-radius:var(--r8);
      min-height:36px;
      font-size:13px;
    }
    .info {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--r12);
      padding:10px 12px;
      font-size:13px;
      color:var(--text-secondary);
      line-height:1.8;
    }
    .stage {
      flex:1;
      background:#fff;
      border-radius:var(--r12);
      overflow:hidden;
      border:1px solid var(--border);
    }
    iframe.module {
      width:100%;
      min-height:1200px;
      border:0;
      display:block;
      background:#fff;
    }
    .controls {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    body.hide .head,
    body.hide .info,
    body.hide .controls {
      display:none;
    }
    body.hide .wrap {
      padding:0;
      gap:0;
    }
    body.hide .stage {
      min-height:100vh;
      border-radius:0;
      border:0;
    }
    @media (max-width:700px) {
      .title { font-size:18px; }
      .wrap { padding:10px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="head">
      <div>
        <div class="title">生徒用画面｜音と画像のデジタル化</div>
        <div class="sub">先生用画面からの切り替えに対応。単独でも利用できます。</div>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-audio" data-mode="audio" class="active">🎵 音のデジタル化</button>
        <button id="tab-image" data-mode="image">🖼 画像のデジタル化</button>
      </div>
    </div>

    <div class="controls">
      <button class="smallbtn" id="toggleChrome">ヘッダーを隠す</button>
    </div>

    <div class="info" id="infoBox">
      同じブラウザ内で先生用画面と一緒に開くと、先生用の切り替えボタンに合わせて表示教材が変わります。
      単独で開いた場合は上のタブで切り替えてください。
    </div>

    <div class="stage">
      <iframe id="moduleFrame" class="module" allow="microphone; camera; autoplay"></iframe>
    </div>
  </div>

  <script>
    const MODULE_URLS = {
      audio: './audio_digitization_oscilloscope.html',
      image: './image_digitization_simulator.html'
    };

    const bc = ('BroadcastChannel' in window)
      ? new BroadcastChannel('joho1_digitalization_dual_v1')
      : null;

    let current = 'audio';
    let chromeHidden = false;

    function setMode(mode, emit) {
      current = mode;
      document.getElementById('moduleFrame').src = MODULE_URLS[mode];
      document.querySelectorAll('.tabs button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });

      document.getElementById('infoBox').textContent = mode === 'audio'
        ? '音の教材です。オシロスコープ・FFT・マイク入力を使って、標本化定理や量子化雑音を観察します。'
        : '画像の教材です。解像度・階調・画素値・カメラ入力を使って、画像のデジタル化を観察します。';

      if (emit && bc) {
        bc.postMessage({ type: 'mode', mode });
      }
    }

    document.getElementById('tab-audio').addEventListener('click', () => setMode('audio', true));
    document.getElementById('tab-image').addEventListener('click', () => setMode('image', true));

    document.getElementById('toggleChrome').addEventListener('click', () => {
      chromeHidden = !chromeHidden;
      document.body.classList.toggle('hide', chromeHidden);
      document.getElementById('toggleChrome').textContent = chromeHidden
        ? 'ヘッダーを表示'
        : 'ヘッダーを隠す';
    });

    window.addEventListener('message', (ev) => {
      const d = ev.data || {};
      if (d.type !== 'gs-height' || !d.height) return;
      const h = Math.max(1100, Math.min(5000, Number(d.height) + 8));
      document.getElementById('moduleFrame').style.height = h + 'px';
    });

    if (bc) {
      bc.onmessage = (ev) => {
        const d = ev.data || {};
        if (d.type === 'mode' && d.mode) {
          setMode(d.mode, false);
        }
      };
    }

    setMode('audio', false);
  </script>
</body>
</html>
